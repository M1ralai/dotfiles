set -g mouse on
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g status-right "%H:%M"
set -g focus-events on
set -g status-style bg=default
set -g status-left-length 99
set -g status-right-length 99
set -g status-justify absolute-centre

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# BEGIN INVISIBLE WORKSPACE — tmux only
# Keep the terminal's default colors: Ghostty renders the wallpaper internally.
set -g status off
set -g status-right ""
set -g pane-border-status off
set -g window-style default
set -g window-active-style default

# Ghostty currently advertises xterm-256color. Keep tmux-256color and all
# existing terminal overrides; use a fixed free slot to avoid reload duplicates.
set -s terminal-features[100] 'xterm-256color:RGB'

# Prefix remains Ctrl-Space. Existing s/w trees and all navigation are retained.
bind S set-option status
bind P display-popup -E -d '#{pane_current_path}' -w 80% -h 70%
# END INVISIBLE WORKSPACE

# BEGIN INVISIBLE WORKSPACE — persistent agent popups
bind A run-shell -b '"$HOME/.config/tmux/agent-popup" codex #{q:client_name} #{q:pane_id} || :'
bind G run-shell -b '"$HOME/.config/tmux/agent-popup" agy #{q:client_name} #{q:pane_id} || :'

# Only integration-owned sessions use these tables. The outer client cannot
# receive prefix keys while its popup is focused; the nested client handles them.
bind -T iw-agent-root C-Space switch-client -T iw-agent-prefix
bind -T iw-agent-prefix C-Space send-keys C-Space
bind -T iw-agent-prefix H detach-client
bind -T iw-agent-prefix A if-shell -F '#{==:#{@iw-agent-kind},codex}' { detach-client } { display-message 'Hide with Ctrl-Space H before opening Codex' }
bind -T iw-agent-prefix G if-shell -F '#{==:#{@iw-agent-kind},agy}' { detach-client } { display-message 'Hide with Ctrl-Space H before opening Antigravity' }
bind -T iw-agent-prefix X confirm-before -p 'Close this agent session and stop its processes? (y/n)' {
  if-shell -F '#{==:#{@iw-agent-owned},invisible-workspace-v1}' { kill-session }
}
# END INVISIBLE WORKSPACE — persistent agent popups
